name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Install OpenCV via vcpkg
        run: |
          # Устанавливаем vcpkg
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          
          # Устанавливаем OpenCV
          C:\vcpkg\vcpkg.exe install opencv:x64-windows --triplet x64-windows
          
          # Интегрируем vcpkg с CMake
          C:\vcpkg\vcpkg.exe integrate install

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Package Application
        shell: pwsh
        run: |
          $releaseDir = "Release_Package"
          New-Item -ItemType Directory -Force -Path $releaseDir

          $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "test|example|d\.exe$" } | Select-Object -First 1
          
          if ($null -eq $exe) {
            Write-Error "Исполняемый файл .exe не найден в папке build!"
            exit 1
          }

          Write-Host "Найден исполняемый файл: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination $releaseDir

          Write-Host "Запуск windeployqt..."
          windeployqt --release --no-compiler-runtime --no-translations "$releaseDir\$($exe.Name)"

          # Копируем DLL OpenCV из vcpkg
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          Get-ChildItem -Path $vcpkgBin -Filter "opencv_*.dll" | Copy-Item -Destination $releaseDir

          Copy-Item -Path "README.md" -Destination "$releaseDir\README.txt" -ErrorAction SilentlyContinue

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "Release_Package\*" -DestinationPath "ImageCompressor_Release.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ImageCompressor_Release.zip
          tag_name: ${{ github.ref_name }}
          name: "Релиз ${{ github.ref_name }}"
          body: |
            ## 🎉 Автоматическая сборка ${{ github.ref_name }}
            
            Эта сборка создана автоматически с помощью GitHub Actions.
            
            ### 📦 Что внутри:
            - Готовый к запуску `.exe` файл
            - Все необходимые библиотеки Qt 6 и OpenCV
            - Файл README с инструкцией
            
            ### 🚀 Как запустить:
            1. Скачайте архив `ImageCompressor_Release.zip`
            2. Распакуйте его в любую папку
            3. Запустите исполняемый файл
            
            *Установка Visual Studio, Qt или OpenCV не требуется!*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}ы